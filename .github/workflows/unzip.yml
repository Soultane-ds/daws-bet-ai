name: Extract project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -q -o daws-bet-ai.zip -d extracted
          rsync -a extracted/daws-bet-ai/ ./
          rm -rf extracted daws-bet-ai.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract DAWS BET AI project" || echo "Nothing to commit"
          git push
